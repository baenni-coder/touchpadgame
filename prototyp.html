   FUCHS-SPRUNG  ·  Prototyp, Stand Phase 4
   Arcade-Jump-&-Run für das Touchpad-Abenteuer

   ZWECK DIESER DATEI:
   Noch nicht das fertige Spiel. Die Grafik ist absichtlich einfach
   und entsteht komplett im Code – es wird keine Bilddatei geladen.

   Drin ist: Titelbild mit Vorführmodus, drei Levels, Laufen und
   Springen mit allen Nachsicht-Mechaniken, Gegner, Stacheln, drei
   Herzen, Checkpoints, Bonus-Diamanten, Punkte mit Kombo,
   Chiptune-Musik, Pause und Spielende.
   Der Fortschritt bleibt auf diesem Gerät gespeichert.

   M = Ton · N = Musik · C = Bildröhren-Optik · Esc = Pause

   Probiere alle drei Steuerungen aus (Tasten 1 / 2 / 3).
   Der Doppelklick-Sprung ist die eigentliche Touchpad-Übung:
   zweimal schnell klicken springt 4.2 statt 2.9 Kacheln hoch –
   nur so kommst du an die blauen Bonus-Diamanten.

   Esc = Pause · R = neu starten · M = Ton an/aus

   Läuft komplett lokal · kein Internet · keine Daten verlassen den Laptop.
   Einfach doppelklicken.

   ZUM ANPASSEN: Ganz oben im <script> steht das Objekt TUNING.
   Dort stellst du Sprunghöhe, Tempo und Schwerkraft ein.
  ============================================================
-->

/* ============================================================
   Ton – rein synthetisch, es wird keine Datei geladen
   ============================================================ */
let AC=null, tonAn=true;
function beep(freq,dur,type='square',vol=.14,glide=0){
  if(!tonAn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,AC.currentTime);
    if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*glide),AC.currentTime+dur);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ============================================================
   MUSIK – ein kleiner Chiptune-Sequenzer
   Keine Audiodatei, alles wird zur Laufzeit berechnet.

   Die Melodie ist eigens für dieses Spiel geschrieben (schlichte
   Dur-Akkordbrechung) – hier steckt keine fremde Musik drin.

   Die Noten stehen unten als Raster: ein Feld = ein Sechzehntel,
   "." heisst "nichts Neues". Zum Ändern einfach Töne austauschen.
     C D E F G A H = Tonleiter, Ziffer = Oktave, "is" = Kreuz
   ============================================================ */
const TAKTE = {
  // Melodie: vier Takte A, vier Takte B
  melodie: `
    C4 .  E4 .  G4 .  E4 .   F4 .  A4 .  G4 .  E4 .
    D4 .  F4 .  A4 .  F4 .   G4 .  H4 .  D5 .  G4 .
    E5 .  D5 .  C5 .  A4 .   G4 .  A4 .  C5 .  .  .
    F4 .  G4 .  A4 .  C5 .   G4 .  E4 .  C4 .  .  .
  `,
  bass: `
    C2 .  .  .  C2 .  .  .   F2 .  .  .  F2 .  .  .
    D2 .  .  .  D2 .  .  .   G2 .  .  .  G2 .  .  .
    A2 .  .  .  A2 .  .  .   F2 .  .  .  F2 .  .  .
    F2 .  .  .  G2 .  .  .   C2 .  .  .  C2 .  .  .
  `,
  // K = Basstrommel, S = Schnarrtrommel, H = Becken
  schlag: `
    K .  H .  S .  H .   K .  H .  S .  H H
    K .  H .  S .  H .   K .  H .  S .  H H
    K .  H .  S .  H .   K .  H .  S .  H H
    K .  H .  S .  H .   K H  S H  S .  H H
  `,
};

const TONHOEHEN = { C:0, Cis:1, D:2, Dis:3, E:4, F:5, Fis:6, G:7, Gis:8, A:9, Ais:10, H:11 };
function tonZuHertz(name){
  const m = /^([A-H](?:is)?)(\d)$/.exec(name);
  if(!m) return null;
  const halbton = TONHOEHEN[m[1]];
  if(halbton === undefined) return null;
  // A4 = 440 Hz als Bezugspunkt
  const abstand = halbton + (+m[2]) * 12 - (9 + 4 * 12);
  return 440 * Math.pow(2, abstand / 12);
}
const spur = t => t.trim().split(/\s+/);

let musikAn = true;
let rauschPuffer = null;
let musikLaeuft = false, schrittNr = 0, naechsterSchritt = 0, musikTakt = null;
const BPM = 132;
const SCHRITT = 60 / BPM / 4;          // ein Sechzehntel in Sekunden

function tonAusgabe(){
  if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}

function rauschen(){
  if(rauschPuffer) return rauschPuffer;
  const n = Math.floor(AC.sampleRate * 0.3);
  rauschPuffer = AC.createBuffer(1, n, AC.sampleRate);
  const d = rauschPuffer.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  return rauschPuffer;
}

/* Eine Note zu einem festen Zeitpunkt einplanen. Über die Uhr des
   AudioContext, nicht über setTimeout – sonst eiert der Takt. */
function note(zeit, hz, dauer, form, laut){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = form; o.frequency.setValueAtTime(hz, zeit);
  g.gain.setValueAtTime(0.0001, zeit);
  g.gain.exponentialRampToValueAtTime(laut, zeit + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, zeit + dauer);
  o.connect(g); g.connect(AC.destination);
  o.start(zeit); o.stop(zeit + dauer + 0.02);
}
function schlagzeug(zeit, art){
  if(art === 'K'){                                  // Basstrommel
    const o = AC.createOscillator(), g = AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(150, zeit);
    o.frequency.exponentialRampToValueAtTime(46, zeit+0.11);
    g.gain.setValueAtTime(0.22, zeit);
    g.gain.exponentialRampToValueAtTime(0.0001, zeit+0.16);
    o.connect(g); g.connect(AC.destination);
    o.start(zeit); o.stop(zeit+0.18);
    return;
  }
  const q = AC.createBufferSource(); q.buffer = rauschen();
  const f = AC.createBiquadFilter(), g = AC.createGain();
  if(art === 'S'){ f.type='bandpass'; f.frequency.value=1900; g.gain.setValueAtTime(0.14, zeit);
                   g.gain.exponentialRampToValueAtTime(0.0001, zeit+0.13); }
  else           { f.type='highpass'; f.frequency.value=7000; g.gain.setValueAtTime(0.05, zeit);
                   g.gain.exponentialRampToValueAtTime(0.0001, zeit+0.045); }
  q.connect(f); f.connect(g); g.connect(AC.destination);
  q.start(zeit); q.stop(zeit + 0.2);
}

function musikSchritt(zeit, i){
  const mel = spur(TAKTE.melodie), bas = spur(TAKTE.bass), sch = spur(TAKTE.schlag);
  const n = Math.max(mel.length, bas.length, sch.length);
  const k = i % n;
  const m = mel[k], b = bas[k], t = sch[k];
  if(m && m !== '.'){ const hz = tonZuHertz(m); if(hz) note(zeit, hz, SCHRITT*1.7, 'square', 0.085); }
  if(b && b !== '.'){ const hz = tonZuHertz(b); if(hz) note(zeit, hz, SCHRITT*2.6, 'triangle', 0.13); }
  if(t && t !== '.') schlagzeug(zeit, t);
}

/* Immer ein Stück im Voraus planen, damit nichts stockt */
function musikTakten(){
  if(!musikLaeuft) return;
  while(naechsterSchritt < AC.currentTime + 0.12){
    musikSchritt(Math.max(naechsterSchritt, AC.currentTime), schrittNr);
    naechsterSchritt += SCHRITT;
    schrittNr++;
  }
}
function musikStart(){
  if(musikLaeuft || !musikAn) return;
  try{
    tonAusgabe(); rauschen();
    musikLaeuft = true; schrittNr = 0; naechsterSchritt = AC.currentTime + 0.1;
    musikTakt = setInterval(musikTakten, 25);
  }catch(e){ musikLaeuft = false; }
}
function musikStopp(){
  musikLaeuft = false;
  if(musikTakt){ clearInterval(musikTakt); musikTakt = null; }
}
function musikUmschalten(){
  musikAn = !musikAn;
  musikAn ? musikStart() : musikStopp();
  knoepfeAuffrischen();
}

/* --- Rohdaten der drei Quellen --- */
const tasten = new Set();
const maus   = { x:0, y:0, imBild:false, unten:false, letzterKlick:0, doppelt:false, schwung:0 };
let letzterSprungTipp = 0, tastenDoppelt = false;   // Doppeltipp auf der Tastatur
let gpVorher = false, gpLetzter = 0, gpDoppelt = false;

addEventListener('keydown', e=>{
  // Profil umschalten
  const p = PROFILE.find(p=>p.taste===e.key);
  if(p){ setzeProfil(p.id); return; }
  if(e.key==='r'||e.key==='R'){ levelNeu(); return; }
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){ if(!gewonnen&&!gameOver) pause=!pause; return; }
  if(szene==='titel' && (e.key===' '||e.key==='Enter')){ spielStarten(); return; }
  if(gameOver && (e.key===' '||e.key==='Enter')){ spielStarten(levelNr); return; }
  if(gewonnen && (e.key===' '||e.key==='Enter')){ naechstesLevel(); return; }
  if(e.key==='Escape' && szene==='spiel' && !gewonnen && !gameOver && pause){ zumTitel(); return; }
  if(e.key==='m'||e.key==='M'){ tonUmschalten(); return; }
  if(e.key==='n'||e.key==='N'){ musikUmschalten(); return; }
  if(e.key==='c'||e.key==='C'){ crtUmschalten(); return; }
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','Spacebar','PageUp','PageDown'].includes(e.key)) e.preventDefault();
  // Zweimal schnell springen = Doppeltipp. e.repeat aussortieren, sonst
  // löst eine gehaltene Taste die Tastenwiederholung als "Doppeltipp" aus.
  const istSprung = e.key===' '||e.key==='Spacebar'||e.key==='ArrowUp'||e.key.toLowerCase()==='w';
  if(istSprung && !e.repeat){
    const jetzt = performance.now();
    if(jetzt - letzterSprungTipp < TUNING.doppelZeit) tastenDoppelt = true;
    letzterSprungTipp = jetzt;
  }
  tasten.add(e.key.toLowerCase());
});
addEventListener('keyup', e=>tasten.delete(e.key.toLowerCase()));
addEventListener('blur', ()=>{ tasten.clear(); maus.unten=false; });

const cv = document.getElementById('cv');
const stage = document.getElementById('stage');
/* Den Zeiger im ganzen Fenster verfolgen, nicht nur über dem Spielfeld.
   Sonst verliert der Fuchs die Steuerung, sobald der Zeiger über den Rand
   hinausgeht – und genau das passiert am Levelende: dort scrollt die Kamera
   nicht mehr weiter, der Fuchs läuft dem Zeiger entgegen und schiebt ihn
   praktisch aus dem Bild. */
addEventListener('pointermove', e=>{
  const r  = cv.getBoundingClientRect();
  const ix = (e.clientX-r.left)/r.width *cv.width;    // in interne Pixel
  const iy = (e.clientY-r.top )/r.height*cv.height;
  // seitlich an den Rand klemmen: der Zeiger "drückt" dann dagegen
  maus.x = Math.max(0, Math.min(cv.width,  ix));
  maus.y = Math.max(0, Math.min(cv.height, iy));
  // Deutlich über oder unter dem Spielfeld (z.B. auf den Knöpfen) ruht die
  // Steuerung – sonst würde der Fuchs weiterlaufen, während man klickt.
  // In Bildschirmpixeln rechnen: intern gemessen wäre die Zone je nach
  // Fenstergrösse unterschiedlich gross.
  const tol = 30 / (r.height/cv.height);
  maus.imBild = iy > -tol && iy < cv.height+tol;
});
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(szene === 'titel'){ spielStarten(); return; }
  maus.unten = true;
  const jetzt = performance.now();
  if(jetzt - maus.letzterKlick < TUNING.doppelZeit) maus.doppelt = true;
  maus.letzterKlick = jetzt;
  cv.setPointerCapture(e.pointerId);
});
addEventListener('pointerup', ()=>{ maus.unten=false; });
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* Zwei Finger auf dem Touchpad (bzw. das Mausrad) treiben die
   Liftplattformen. Der Schwung klingt weich ab, damit der Lift nicht
   bei jeder Rastung ruckelt. */
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const rastungen = e.deltaMode === 1 ? e.deltaY : e.deltaY/100;
  maus.schwung = Math.max(-1, Math.min(1, maus.schwung + rastungen*TUNING.scrollProRad));
}, { passive:false });

/* --- Rohdaten -> abstrakte Eingabe. Nur das aktive Profil wird gelesen. --- */
function leseEingabe(){
  let x=0, y=0, sprung=false, extra=false;
  maus.schwung *= TUNING.scrollAbklang;
  if(Math.abs(maus.schwung) < 0.02) maus.schwung = 0;

  if(profil==='tastatur'){
    if(tasten.has('arrowleft') ||tasten.has('a')) x-=1;
    if(tasten.has('arrowright')||tasten.has('d')) x+=1;
    sprung = tasten.has(' ')||tasten.has('arrowup')||tasten.has('w');
    extra = tastenDoppelt; tastenDoppelt = false;
    // Für den Lift: Bild hoch / Bild runter. Pfeil hoch ist schon Springen.
    if(tasten.has('pageup'))   y -= 1;
    if(tasten.has('pagedown')) y += 1;

  }else if(profil==='touchpad'){
    if(maus.imBild){
      // Der Fuchs läuft dorthin, wo der Zeiger ist – mit Totzone,
      // damit er nicht zittert, wenn der Zeiger genau auf ihm liegt.
      const fuchsBild = spieler.x + spieler.b/2 - kamera.x;
      const d = maus.x - fuchsBild;
      if(Math.abs(d) > TUNING.totzone) x = Math.sign(d);
      // Kleine Distanzen = langsam gehen (feines Touchpad-Training)
      if(Math.abs(d) < TUNING.totzone*2.6) x *= 0.55;

      // Randzone: liegt der Zeiger ganz aussen, läuft der Fuchs weiter –
      // auch wenn er ihn längst eingeholt hat. Ohne das bleibt er am
      // Levelende stehen, sobald die Kamera nicht mehr mitscrollt.
      if(maus.x <= TUNING.randzone)                 x = -1;
      else if(maus.x >= cv.width - TUNING.randzone) x =  1;
    }
    sprung = maus.unten;
    extra = maus.doppelt; maus.doppelt = false;
    y = maus.schwung;                      // zwei Finger auf dem Touchpad

  }else if(profil==='gamepad'){
    const gp = (navigator.getGamepads?.()||[])[0];
    if(gp){
      const ax = gp.axes[0]||0;
      if(Math.abs(ax)>0.25) x = ax;
      if(gp.buttons[14]?.pressed) x=-1;
      if(gp.buttons[15]?.pressed) x= 1;
      sprung = !!(gp.buttons[0]?.pressed || gp.buttons[1]?.pressed);
      // Doppeltipp auf der Sprungtaste – oder einfach die B-Taste
      if(sprung && !gpVorher){
        const jetzt = performance.now();
        if(jetzt - gpLetzter < TUNING.doppelZeit) gpDoppelt = true;
        gpLetzter = jetzt;
      }
      gpVorher = sprung;
      if(gp.buttons[2]?.pressed || gp.buttons[3]?.pressed) gpDoppelt = true;
      extra = gpDoppelt; gpDoppelt = false;
      const ay = gp.axes[3] || 0;          // rechter Stick für den Lift
      if(Math.abs(ay) > 0.25) y = ay;
      if(gp.buttons[4]?.pressed) y = -1;
      if(gp.buttons[5]?.pressed) y =  1;
    }
  }

  eingabe.sprungNeu = sprung && !eingabe.sprung;   // genau in diesem Bild gedrückt
  eingabe.sprung = sprung;
  eingabe.extraNeu = extra;
  eingabe.x = Math.max(-1, Math.min(1, x));
  eingabe.y = Math.max(-1, Math.min(1, y));
}

/* ============================================================
   LEVEL EINLESEN
   ============================================================ */
let karte=[], levelB=0, levelH=0, muenzen=[], startPos={x:0,y:0}, zielPos={x:0,y:0};
let gegner=[], checkpoints=[], startVorlage=[], lifte=[], liftVorlage=[];

function levelLaden(){
  const L = LEVELS[levelNr].karte;
  levelB = Math.max(...L.map(z=>z.length));
  levelH = L.length;
  karte = L.map(z => z.padEnd(levelB,'.').split(''));
  muenzen=[]; checkpoints=[]; startVorlage=[]; liftVorlage=[];
  for(let r=0;r<levelH;r++) for(let c=0;c<levelB;c++){
    const z = karte[r][c];
    const mx = c*TILE+TILE/2, my = r*TILE+TILE/2;
    if(z==='o'){ muenzen.push({x:mx,y:my,weg:false,t:Math.random()*6,bonus:false}); karte[r][c]='.'; }
    if(z==='B'){ muenzen.push({x:mx,y:my,weg:false,t:Math.random()*6,bonus:true }); karte[r][c]='.'; }
    if(z==='P'){ startPos={x:c*TILE, y:r*TILE}; karte[r][c]='.'; }
    if(z==='F'){ zielPos={x:c*TILE, y:r*TILE}; karte[r][c]='.'; }
    if(z==='C'){ checkpoints.push({x:c*TILE, y:r*TILE, aktiv:false}); karte[r][c]='.'; }
    if(z==='L'){ startVorlage.push({art:'laeufer', x:c*TILE+3, y:r*TILE+2}); karte[r][c]='.'; }
    if(z==='V'){ startVorlage.push({art:'flieger', x:c*TILE+2, y:r*TILE+2}); karte[r][c]='.'; }
    if(z==='A'){ liftVorlage.push({c, r}); karte[r][c]='.'; }
  }
  gegnerSetzen();
  lifteSetzen();
}

/* Gegner aus der Vorlage neu aufstellen – nach jedem Tod von vorn */
function gegnerSetzen(){
  gegner = startVorlage.map(v=>({
    art:v.art, x:v.x, y:v.y, heimY:v.y,
    b: v.art==='laeufer'?13:15, h: v.art==='laeufer'?12:11,
    vx: v.art==='laeufer' ? -TUNING.gegnerTempo : -TUNING.fliegerTempo,
    t: Math.random()*6, tot:false, totT:0, schritt:0
  }));
}

/* ============================================================
   LIFTPLATTFORMEN
   Fahren hoch und runter, solange gescrollt wird – mit zwei
   Fingern auf dem Touchpad. Das ist die Übung aus der Station
   "Hoch und runter", nur mitten im Spiel.

   Wie weit ein Lift fährt, ergibt sich aus seinem Schacht: er
   hält an, wo darüber oder darunter fester Boden kommt.
   ============================================================ */
const LIFT_BREITE = 3;          // Kacheln
const LIFT_DICKE  = 6;          // Pixel

function lifteSetzen(){
  lifte = liftVorlage.map(v=>{
    // Der Fahrweg ergibt sich aus den Führungswänden links und rechts:
    // wo keine Wand mehr ist, hält der Lift. Ohne diese Regel führe er
    // bis unter den Himmel, weil dort nichts im Weg steht.
    let oben = v.r, unten = v.r;
    const freiBei = rr => {
      for(let i=0;i<LIFT_BREITE;i++) if(fest(v.c+i, rr)) return false;
      return true;
    };
    const gefuehrtBei = rr => fest(v.c-1, rr) || fest(v.c+LIFT_BREITE, rr);
    while(oben-1 >= 0      && freiBei(oben-1)  && gefuehrtBei(oben-1))  oben--;
    while(unten+1 < levelH && freiBei(unten+1) && gefuehrtBei(unten+1)) unten++;
    return {
      x: v.c*TILE, y: v.r*TILE,
      b: LIFT_BREITE*TILE, h: LIFT_DICKE,
      obenGrenze: oben*TILE, untenGrenze: unten*TILE,
      dy: 0, start: v.r*TILE,
    };
  });
}

/* Trägt der Lift den Fuchs gerade? */
function liftUnterSpieler(){
  const fussY = spieler.y + spieler.h;
  return lifte.find(l =>
    spieler.x + spieler.b > l.x + 1 && spieler.x < l.x + l.b - 1 &&
    fussY >= l.y - 2 && fussY <= l.y + l.h + 2) || null;
}

function lifteSchritt(){
  const trage = liftUnterSpieler();
  lifte.forEach(l=>{
    const vorher = l.y;
    l.y += eingabe.y * TUNING.liftTempo * DT;
    l.y = Math.max(l.obenGrenze, Math.min(l.untenGrenze, l.y));
    l.dy = l.y - vorher;
  });
  // Wer oben draufsteht, fährt mit
  if(trage && trage.dy !== 0){
    spieler.y += trage.dy;
    if(trage.dy < 0) spieler.vy = Math.min(spieler.vy, 0);   // beim Hochfahren nicht durchsacken
  }
}

const fest    = (c,r)=> (r<0||c<0||c>=levelB) ? false : (r>=levelH ? false : karte[r][c]==='#');
const einweg  = (c,r)=> (r<0||c<0||c>=levelB||r>=levelH) ? false : karte[r][c]==='=';
const stachel = (c,r)=> (r<0||c<0||c>=levelB||r>=levelH) ? false : karte[r][c]==='^';

/* ============================================================
   DER SPIELER
   ============================================================ */
const spieler = {
  x:0, y:0, b:11, h:16,            // Rechteck für die Kollision (schmaler als die Figur)
  vx:0, vy:0,
  amBoden:false, wardAmBoden:false,
  coyote:0, puffer:0, sprungGehalten:false, absprungY:0, extraFrei:false, extraT:0,
  blick:1, laufPhase:0, squash:1, tot:false, totT:0,
  leben:3, schonzeit:0, respawnX:0, respawnY:0
};

/* Vom Titelbild ins Spiel */
function spielStarten(nr = levelNr){
  levelNr = nr;
  levelNeu();
  szene = 'bereit'; szeneT = 0; blende = 1;
  baueLevelKnoepfe();
}
/* Zurück aufs Titelbild */
function zumTitel(){
  szene = 'titel'; szeneT = 0; blende = 1;
  levelNeu();
  baueLevelKnoepfe();
}

/* Attract-Modus: auf dem Titelbild läuft der Fuchs von allein.
   Er schaut eine halbe Kachel voraus und springt, wenn dort eine
   Lücke, eine Stufe oder ein Gegner ist. */
function selbstSteuern(){
  eingabe.x = 1;
  eingabe.sprung = false; eingabe.sprungNeu = false; eingabe.extraNeu = false;
  const vorne = spieler.x + spieler.b + 6;
  const c = Math.floor(vorne/TILE);
  const rFuss = Math.floor((spieler.y + spieler.h + 2)/TILE);
  const rKopf = Math.floor((spieler.y + spieler.h/2)/TILE);
  const abgrund = !fest(c,rFuss) && !einweg(c,rFuss);
  const stufe   = fest(c,rKopf) || stachel(c,rKopf);
  const gegnerVoraus = gegner.some(g=>!g.tot && Math.abs(g.x-spieler.x)<TILE*2.2
                                    && Math.abs(g.y-spieler.y)<TILE*1.5);
  if(spieler.amBoden && (abgrund || stufe || gegnerVoraus)){
    eingabe.sprung = true; eingabe.sprungNeu = true;
  }else if(!spieler.amBoden && spieler.vy < 0){
    eingabe.sprung = true;                  // hoch halten, solange er steigt
  }
  // Am Levelende oder nach einem Sturz von vorn beginnen
  if(spieler.x > (levelB-4)*TILE || spieler.tot || gameOver) levelNeu();
}

function levelWechseln(nr){
  if(nr<0 || nr>=LEVELS.length) return;
  spielStarten(nr);
}
function naechstesLevel(){
  if(levelNr+1 < LEVELS.length) levelWechseln(levelNr+1);
  else levelWechseln(0);                 // nach dem letzten wieder von vorn
}

function levelNeu(){
  levelLaden();
  spieler.x=startPos.x+3; spieler.y=startPos.y+2;
  spieler.vx=0; spieler.vy=0; spieler.tot=false; spieler.totT=0;
  spieler.coyote=0; spieler.puffer=0; spieler.squash=1;
  spieler.extraFrei=false; spieler.extraT=0; spieler.absprungY=spieler.y;
  spieler.leben = TUNING.leben; spieler.schonzeit = 0;
  spieler.respawnX = spieler.x; spieler.respawnY = spieler.y;
  punkte=0; boni=0; zeit=0; partikel.length=0; texte.length=0;
  liftHinweis = 3;
  punktestand=0; kombo=0; komboT=0; zielBonus={herzen:0,zeit:0};
  gewonnen=false; gewonnenT=0; gameOver=false; gameOverT=0; pause=false;
  ruettelStaerke=0;
  kamera.x=0; kamera.y=0; kameraSetzen(true);
}

function spielerSchritt(){
  const T=TUNING;

  /* --- waagerecht: beschleunigen oder bremsen --- */
  const ziel = eingabe.x * T.maxLauf;
  const beschl = spieler.amBoden ? T.beschlBoden : T.beschlLuft;
  const bremse = spieler.amBoden ? T.bremseBoden : T.bremseLuft;
  if(Math.abs(eingabe.x) > 0.05){
    const dv = ziel - spieler.vx;
    spieler.vx += Math.sign(dv) * Math.min(Math.abs(dv), beschl*DT);
    spieler.blick = Math.sign(eingabe.x);
  }else{
    const dv = Math.min(Math.abs(spieler.vx), bremse*DT);
    spieler.vx -= Math.sign(spieler.vx)*dv;
  }

  /* --- Coyote Time und Sprungpuffer ---
     Das sind die zwei Mechaniken, die aus "unfair" "verzeihend" machen. */
  spieler.coyote = spieler.amBoden ? T.coyoteZeit : Math.max(0, spieler.coyote-DT);
  spieler.puffer = eingabe.sprungNeu ? T.puffer     : Math.max(0, spieler.puffer-DT);

  if(spieler.puffer>0 && spieler.coyote>0){
    spieler.vy = -T.sprungKraft;
    spieler.puffer=0; spieler.coyote=0;
    spieler.amBoden=false; spieler.sprungGehalten=true;
    spieler.squash = 0.78;              // Streckung beim Absprung
    spieler.absprungY = spieler.y;      // Bezugspunkt für den Doppelklick-Sprung
    spieler.extraFrei = true;           // einmal pro Sprung
    sfx.sprung();
    staub(spieler.x+spieler.b/2, spieler.y+spieler.h, 4, '#CBB89A');
  }

  /* --- Doppelklick-Sprung ---
     Der erste Klick springt schon los; der zweite gibt den Extraschub.
     Statt eines festen Impulses rechnen wir die noch fehlende Höhe aus.
     So ist der Sprung IMMER gleich hoch, egal wie schnell der zweite Klick
     kommt – nur damit lässt sich ein Level verlässlich entwerfen. */
  if(eingabe.extraNeu && spieler.extraFrei && !spieler.amBoden){
    const gestiegen = spieler.absprungY - spieler.y;
    const rest = T.extraHoehe - gestiegen;
    if(rest > 4){
      spieler.vy = -Math.sqrt(2*T.gravAufwaerts*rest);
      // Bewusst NICHT sprungGehalten setzen: ein Doppelklick ist kurz-kurz,
      // niemand hält dabei die Taste. Mit sprungGehalten würde der Sprung
      // beim Loslassen sofort wieder gekappt und bliebe wirkungslos.
      spieler.sprungGehalten = false;
      spieler.extraFrei = false;
      spieler.squash = 0.72;
      spieler.extraT = 0.45;            // für den Glitzereffekt beim Zeichnen
      sfx.extra();
      for(let i=0;i<8;i++) staub(spieler.x+spieler.b/2, spieler.y+spieler.h, 1, '#FFC93C');
    }
  }
  if(spieler.extraT>0) spieler.extraT -= DT;
  // Taste früh loslassen -> kleinerer Sprung (variable Sprunghöhe)
  if(spieler.sprungGehalten && !eingabe.sprung && spieler.vy<0){
    spieler.vy *= T.sprungAbbruch;
    spieler.sprungGehalten=false;
  }
  if(spieler.vy>=0) spieler.sprungGehalten=false;

  /* --- senkrecht: unterschiedliche Schwerkraft rauf/runter --- */
  spieler.vy += (spieler.vy<0 ? T.gravAufwaerts : T.gravAbwaerts) * DT;
  spieler.vy = Math.min(spieler.vy, T.maxFall);

  /* --- bewegen und mit der Karte verrechnen (X und Y getrennt!) --- */
  spieler.wardAmBoden = spieler.amBoden;
  bewegeX(spieler.vx*DT);
  bewegeY(spieler.vy*DT);

  if(spieler.amBoden && !spieler.wardAmBoden){
    spieler.extraFrei = false;
    sfx.landung();
    spieler.squash = 1.32;              // Stauchung bei der Landung
    staub(spieler.x+spieler.b/2, spieler.y+spieler.h, 5, '#CBB89A');
  }
  spieler.squash += (1-spieler.squash)*0.22;
  if(spieler.schonzeit>0) spieler.schonzeit -= DT;

  // Laufanimation
  if(spieler.amBoden) spieler.laufPhase += Math.abs(spieler.vx)*DT*0.42;
  else spieler.laufPhase = 0;

  // Herausgefallen?
  if(spieler.y > levelH*TILE + 40) sterben();
}

function bewegeX(d){
  spieler.x += d;
  const oben = Math.floor(spieler.y/TILE);
  const unten= Math.floor((spieler.y+spieler.h-1)/TILE);
  if(d>0){
    const c = Math.floor((spieler.x+spieler.b-1)/TILE);
    for(let r=oben;r<=unten;r++) if(fest(c,r)){ spieler.x = c*TILE-spieler.b; spieler.vx=0; break; }
  }else if(d<0){
    const c = Math.floor(spieler.x/TILE);
    for(let r=oben;r<=unten;r++) if(fest(c,r)){ spieler.x = (c+1)*TILE; spieler.vx=0; break; }
  }
  spieler.x = Math.max(0, Math.min(spieler.x, levelB*TILE-spieler.b));
}

function bewegeY(d){
  const vorherUnten = spieler.y + spieler.h;
  spieler.y += d;
  const links = Math.floor(spieler.x/TILE);
  const rechts= Math.floor((spieler.x+spieler.b-1)/TILE);

  if(d>0){                                  // fallen -> Boden suchen
    // Erst die Lifte: sie liegen nicht in der Kachelkarte und tragen
    // nur von oben, wie eine Einweg-Plattform.
    for(const l of lifte){
      if(spieler.x + spieler.b > l.x + 1 && spieler.x < l.x + l.b - 1 &&
         vorherUnten <= l.y + 2 && spieler.y + spieler.h >= l.y){
        spieler.y = l.y - spieler.h; spieler.vy = 0; spieler.amBoden = true;
        return;
      }
    }
    // Achtung: hier OHNE -1 rechnen. Liegt der Fuchs exakt auf einer Kachel,
    // zeigt (y+h-1) eine Zeile zu hoch – er würde jeden Einzelschritt zwischen
    // "steht" und "fällt" flackern (Dauerstaub, Coyote Time wirkungslos).
    const r = Math.floor((spieler.y+spieler.h)/TILE);
    let treffer=false;
    for(let c=links;c<=rechts;c++){
      if(fest(c,r)) treffer=true;
      // Einweg-Plattform: nur fangen, wenn er vorher oberhalb war
      else if(einweg(c,r) && vorherUnten <= r*TILE+1) treffer=true;
      if(treffer) break;
    }
    if(treffer){ spieler.y = r*TILE-spieler.h; spieler.vy=0; spieler.amBoden=true; }
    else spieler.amBoden=false;

  }else if(d<0){                            // steigen -> Decke
    const r = Math.floor(spieler.y/TILE);
    let treffer=false;
    for(let c=links;c<=rechts;c++) if(fest(c,r)){ treffer=true; break; }
    if(treffer){
      // Eckenkorrektur: knapp an der Kante vorbei? Dann sanft danebenschieben,
      // statt den Sprung abzuwürgen. Das fühlt sich viel fairer an.
      const linksFrei  = !fest(links, r),  rechtsFrei = !fest(rechts,r);
      const ueberstandL = (links+1)*TILE - spieler.x;
      const ueberstandR = (spieler.x+spieler.b) - rechts*TILE;
      if(rechtsFrei && ueberstandL<=TUNING.eckenHilfe){ spieler.x += ueberstandL; }
      else if(linksFrei && ueberstandR<=TUNING.eckenHilfe){ spieler.x -= ueberstandR; }
      else { spieler.y = (r+1)*TILE; spieler.vy=0; }
    }
    spieler.amBoden=false;
  }
}

/* ============================================================
   TREFFER, LEBEN UND CHECKPOINTS
   Für 8-Jährige bewusst nachsichtig: ein Treffer kostet ein Herz,
   danach gibt es eine Schonzeit. Wer alle Herzen verliert, fängt
   am letzten Checkpoint wieder an – nicht am Levelanfang.
   ============================================================ */
function treffer(vonX){
  if(spieler.schonzeit>0 || spieler.tot || gameOver || gewonnen) return;
  spieler.leben--;
  spieler.schonzeit = TUNING.unverwundbar;
  // Rückstoss weg von der Gefahr, plus ein kleiner Hüpfer
  spieler.vx = (spieler.x+spieler.b/2 < vonX ? -1 : 1) * TUNING.rueckstoss;
  spieler.vy = -140;
  spieler.amBoden = false;
  ruetteln(5);
  sfx.aua();
  for(let i=0;i<7;i++) staub(spieler.x+spieler.b/2, spieler.y+spieler.h/2, 1, '#FF6B6B');
  if(spieler.leben<=0) zuEnde();
}

function sterben(){                      // Sturz in den Abgrund
  if(spieler.tot || gameOver) return;
  spieler.tot=true; spieler.totT=0;
  spieler.leben--;
  ruetteln(4);
  sfx.sterben();
  if(spieler.leben<=0) zuEnde();
}

function zuEnde(){
  gameOver = true; gameOverT = 0;
  spieler.leben = 0;
  sfx.ende();
}

/* Am letzten erreichten Checkpoint neu anfangen */
function beimCheckpointStarten(){
  spieler.x = spieler.respawnX; spieler.y = spieler.respawnY;
  spieler.vx=0; spieler.vy=0; spieler.tot=false; spieler.totT=0;
  spieler.schonzeit = TUNING.unverwundbar;
  spieler.extraFrei=false; spieler.extraT=0; spieler.absprungY=spieler.y;
  gegnerSetzen();                        // Gegner wieder aufstellen
  kameraSetzen(true);
}

/* ============================================================
   GEGNER
   Zwei Sorten, bewusst einfach und berechenbar – Kinder sollen
   ihr Verhalten nach zwei Sekunden Zuschauen verstehen.
   ============================================================ */
function gegnerSchritt(){
  gegner.forEach(g=>{
    if(g.tot){ g.totT += DT; return; }
    g.t += DT;

    if(g.art==='laeufer'){
      // läuft hin und her, dreht an Wänden UND an Abgründen um
      g.x += g.vx*DT;
      const vorne = g.vx<0 ? g.x-1 : g.x+g.b+1;
      const cV = Math.floor(vorne/TILE);
      const rMitte = Math.floor((g.y+g.h/2)/TILE);
      const rUnten = Math.floor((g.y+g.h+2)/TILE);
      const wand    = fest(cV,rMitte) || stachel(cV,rMitte);
      const abgrund = !fest(cV,rUnten) && !einweg(cV,rUnten);
      if(wand || abgrund){
        g.vx *= -1;
        g.x += g.vx*DT*2;                // aus der Wand herausschieben
      }
      // auf dem Boden halten
      const rBoden = Math.floor((g.y+g.h)/TILE);
      const cM = Math.floor((g.x+g.b/2)/TILE);
      if(fest(cM,rBoden)||einweg(cM,rBoden)) g.y = rBoden*TILE - g.h;
      else g.y += 120*DT;
      g.schritt += Math.abs(g.vx)*DT*0.5;

    }else{                               // Flieger: waagerecht plus Sinuswelle
      g.x += g.vx*DT;
      const cV = Math.floor((g.vx<0 ? g.x-1 : g.x+g.b+1)/TILE);
      const rM = Math.floor((g.y+g.h/2)/TILE);
      if(fest(cV,rM) || g.x<8 || g.x>levelB*TILE-g.b-8) g.vx *= -1;
      g.y = g.heimY + Math.sin(g.t*2.0)*TUNING.fliegerAmplitude;
      g.schritt += DT*9;                 // Flügelschlag
    }
  });
  // besiegte Gegner nach kurzer Zeit entfernen
  gegner = gegner.filter(g=>!g.tot || g.totT<0.7);
}

/* Berührung Spieler <-> Gegner */
function gegnerPruefen(){
  gegner.forEach(g=>{
    if(g.tot) return;
    const ueberlappt = spieler.x < g.x+g.b && spieler.x+spieler.b > g.x &&
                       spieler.y < g.y+g.h && spieler.y+spieler.h > g.y;
    if(!ueberlappt) return;

    // Von oben draufgesprungen? Dann ist der Gegner erledigt.
    const vonOben = spieler.vy > 40 && (spieler.y+spieler.h) < g.y + g.h*0.7;
    if(vonOben){
      g.tot=true; g.totT=0;
      spieler.vy = -TUNING.abprall;      // Abprall, damit man weiterhüpfen kann
      spieler.extraFrei = true;          // nach dem Abprall darf man wieder doppeln
      spieler.absprungY = spieler.y;
      spieler.squash = 0.8;
      komboErhoehen();
      punkteGeben(WERT.gegner*kombo, g.x+g.b/2, g.y, '+'+(WERT.gegner*kombo));
      sfx.platt();
      for(let i=0;i<8;i++) staub(g.x+g.b/2, g.y+g.h/2, 1, '#9775FA');
      ruetteln(2);
    }else{
      treffer(g.x+g.b/2);
    }
  });
}

/* Stacheln: die Kacheln unter und neben dem Fuchs prüfen */
function stachelnPruefen(){
  if(spieler.schonzeit>0) return;
  const c0=Math.floor(spieler.x/TILE), c1=Math.floor((spieler.x+spieler.b-1)/TILE);
  const r0=Math.floor(spieler.y/TILE),  r1=Math.floor((spieler.y+spieler.h-1)/TILE);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(stachel(c,r)){ treffer(c*TILE+TILE/2); return; }
  }
}

/* Checkpoints einsammeln */
function checkpointsPruefen(){
  checkpoints.forEach(p=>{
    if(p.aktiv) return;
    if(Math.abs(p.x+8-(spieler.x+spieler.b/2))<14 && Math.abs(p.y+8-(spieler.y+spieler.h/2))<18){
      p.aktiv=true;
      spieler.respawnX = p.x+3; spieler.respawnY = p.y+2;
      sfx.checkpoint();
      for(let i=0;i<10;i++) staub(p.x+8,p.y+4,1,'#2FC79B');
    }
  });
}

/* Bildschirm-Rüttler */
let ruettelStaerke = 0;
function ruetteln(n){ ruettelStaerke = Math.max(ruettelStaerke, n); }

/* ============================================================
   KAMERA – mit Totzone, damit sie nicht am Fuchs klebt
   ============================================================ */
const kamera = { x:0, y:0 };
const SICHT_B = 360, SICHT_H = 200;

function kameraSetzen(sofort=false){
  const zielX = spieler.x + spieler.b/2 - SICHT_B/2 + spieler.blick*29;  // Vorausschau
  // Der Fuchs sitzt bewusst etwas tiefer im Bild: bei einem Plattformer
  // schaut man nach oben (wohin man springt), nicht nach unten. Ausserdem
  // rutschten Sprungziele sonst hinter die Anzeigeleiste.
  const zielY = spieler.y + spieler.h/2 - SICHT_H/2 - 11;
  const t = sofort ? 1 : 0.11;
  kamera.x += (zielX-kamera.x)*t;
  kamera.y += (zielY-kamera.y)*t;
  kamera.x = Math.max(0, Math.min(kamera.x, levelB*TILE - SICHT_B));
  kamera.y = Math.max(-29, Math.min(kamera.y, levelH*TILE - SICHT_H));
}

/* Aufsteigende Zahlen – das Arcade-Gefühl steckt in solchen Kleinigkeiten */
const texte = [];
function floattext(x, y, txt, farbe='#FFE9A8'){
  texte.push({ x, y, txt, farbe, alter:0, leben:0.85 });
}
function texteSchritt(){
  for(let i=texte.length-1;i>=0;i--){
    const t = texte[i];
    t.alter += DT; t.y -= 26*DT;
    if(t.alter >= t.leben) texte.splice(i,1);
  }
}

/* ============================================================
   PARTIKEL (Staub) – kleiner Aufwand, grosse Wirkung
   ============================================================ */
const partikel=[];
function staub(x,y,n,farbe){
  for(let i=0;i<n;i++) partikel.push({
    x, y, vx:(Math.random()-.5)*46, vy:-Math.random()*30,
    leben:.34+Math.random()*.25, alter:0, farbe, r:1+Math.random()*1.4
  });
}
function partikelSchritt(){
  for(let i=partikel.length-1;i>=0;i--){
    const p=partikel[i];
    p.alter+=DT; p.x+=p.vx*DT; p.y+=p.vy*DT; p.vy+=220*DT; p.vx*=0.94;
    if(p.alter>=p.leben) partikel.splice(i,1);
  }
}

/* Name -> [Blatt, Feldnummer]. Feldnummern zeilenweise ab 0.
   Zum Abzählen hilft: node tools/atlas-zeigen.mjs <datei> <zelle> <spalten> */
const SPRITES = {
  // --- der Fuchs (eigen) ---
  fuchs_steh:  ['eigen',0], fuchs_lauf0:['eigen',1], fuchs_lauf1:['eigen',2],
  fuchs_lauf2: ['eigen',3], fuchs_lauf3:['eigen',4],
  fuchs_spring:['eigen',5], fuchs_fall: ['eigen',6], fuchs_aua:  ['eigen',7],
  ziel:        ['eigen',35],

  // --- Gegner (Kenney-Figuren) ---
  kaefer0:['figuren',11], kaefer1:['figuren',12], kaefer_platt:['figuren',11],
  flieger0:['figuren',24], flieger1:['figuren',25],

  // --- Kacheln (Kenney) ---
  // Kenney liefert von jeder Sorte zwei Varianten: eine gerahmte für
  // einzeln stehende Blöcke (Feld 1) und eine nahtlose für Flächen
  // (Feld 2). Nimmt man die gerahmte für den Boden, zieht sich ein
  // Gitter durch die ganze Landschaft.
  boden_oben:   ['kenney',2],   // nahtlose Grasfläche
  boden_einzeln:['kenney',1],   // gerahmt, für allein stehende Blöcke
  boden_mitte:  ['kenney',122], // nahtlose Erde
  plattform_l:  ['kenney',48], plattform_m:['kenney',49], plattform_r:['kenney',50],
  stachel:      ['kenney',68],

  // --- Gegenstände ---
  // Kenneys Münzen sitzen in einem Kachelrahmen und taugen nicht als
  // frei schwebende Münze – dafür bleibt das eigene, animierte Sprite.
  muenze0:['eigen',13], muenze1:['eigen',14], muenze2:['eigen',15], muenze3:['eigen',16],
  diamant0:['kenney',67], diamant1:['kenney',67], diamant2:['kenney',67], diamant3:['kenney',67],
  herz_voll:['kenney',44], herz_leer:['kenney',46],
  fahne_aus:['kenney',111], fahne_an:['kenney',112],
  busch:['kenney',124], baum:['kenney',126],
};

/* Bilder laden. Gezeichnet wird erst, wenn alle da sind – sonst
   blitzt beim Start ein halb leeres Bild auf. */
const bilder = {};
let bilderOffen = Object.keys(BLAETTER).length;
let atlasBereit = false;
for(const [name, blatt] of Object.entries(BLAETTER)){
  const img = new Image();
  img.onload  = ()=>{ if(--bilderOffen === 0) atlasBereit = true; };
  img.onerror = ()=>{ if(--bilderOffen === 0) atlasBereit = true; };
  img.src = blatt.quelle;
  bilder[name] = img;
}

/* Ein Sprite zeichnen. x,y ist die linke obere Ecke im Kachelraster;
   grössere Sprites werden darauf zentriert und unten bündig gesetzt,
   damit eine 24er-Figur nicht in der Kachel schwebt. */
function sprite(name, x, y, spiegeln=false){
  if(!atlasBereit) return;
  const eintrag = SPRITES[name];
  if(!eintrag) return;
  const [blattName, nr] = eintrag;
  const blatt = BLAETTER[blattName], img = bilder[blattName];
  if(!img || !img.width) return;
  const Z = blatt.zelle;
  const sx = (nr % blatt.spalten) * Z, sy = Math.floor(nr / blatt.spalten) * Z;
  const zx = Math.round(x - (Z - TILE)/2);     // waagerecht mittig
  const zy = Math.round(y - (Z - TILE));       // unten bündig
  if(spiegeln){
    ctx.save();
    ctx.translate(zx + Z, zy);
    ctx.scale(-1, 1);
    ctx.drawImage(img, sx, sy, Z, Z, 0, 0, Z, Z);
    ctx.restore();
  }else{
    ctx.drawImage(img, sx, sy, Z, Z, zx, zy, Z, Z);
  }
}

/* Welcher Kachel-Sprite passt hier? Hängt von den Nachbarn ab
   ("Autotiling") – sonst sieht eine Kante aus wie die Mitte. */
function kachelName(c, r){
  const z = karte[r][c];
  if(z === '='){
    const l = einweg(c-1,r), re = einweg(c+1,r);
    return !l ? 'plattform_l' : (!re ? 'plattform_r' : 'plattform_m');
  }
  if(z === '^') return 'stachel';
  if(z !== '#') return null;
  const oben = fest(c,r-1), links = fest(c-1,r), rechts = fest(c+1,r);
  // Steht der Block ganz für sich, passt die gerahmte Variante.
  if(!oben && !links && !rechts) return 'boden_einzeln';
  return oben ? 'boden_mitte' : 'boden_oben';
}

/* Welche Haltung hat der Fuchs gerade? */
function fuchsBild(){
  const s = spieler;
  if(s.schonzeit > 0 && !s.amBoden) return 'fuchs_aua';
  if(!s.amBoden) return s.vy < 0 ? 'fuchs_spring' : 'fuchs_fall';
  if(Math.abs(s.vx) > 8) return 'fuchs_lauf' + (Math.floor(s.laufPhase*2) % 4);
  return 'fuchs_steh';
}


function zeichne(){
  // Bildschirm-Rüttler: verschiebt nur die Darstellung, nicht die Physik
  const rt = ruettelStaerke;
  const rx = rt>0 ? (Math.random()-.5)*rt*2 : 0;
  const ry = rt>0 ? (Math.random()-.5)*rt*2 : 0;
  const kx = Math.round(kamera.x + rx), ky = Math.round(kamera.y + ry);

  /* Himmel */
  const g = ctx.createLinearGradient(0,0,0,SICHT_H);
  g.addColorStop(0,'#FFF1DC'); g.addColorStop(1,'#BFE3FF');
  ctx.fillStyle=g; ctx.fillRect(0,0,SICHT_B,SICHT_H);

  /* Parallax: Sonne, ferne Hügel, nahe Hügel */
  ctx.fillStyle='#FFD98A';
  ctx.beginPath(); ctx.arc(302-kx*0.04, 38-ky*0.04, 17, 0, 7); ctx.fill();

  huegel(kx*0.16, 142, 51, '#BFE0C6');
  wolken(kx*0.22, ky*0.10);
  huegel(kx*0.34, 162, 38, '#9ED4AE');

  /* Kacheln – nur den sichtbaren Ausschnitt zeichnen */
  const c0=Math.max(0,Math.floor(kx/TILE)), c1=Math.min(levelB-1,Math.ceil((kx+SICHT_B)/TILE));
  const r0=Math.max(0,Math.floor(ky/TILE)), r1=Math.min(levelH-1,Math.ceil((ky+SICHT_H)/TILE));
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    const n = kachelName(c,r);
    if(n) sprite(n, c*TILE-kx, r*TILE-ky);
  }

  /* Checkpoints */
  checkpoints.forEach(p=>{
    const px2=p.x-kx, py=p.y-ky;
    if(px2<-20||px2>SICHT_B+20) return;
    sprite(p.aktiv ? 'fahne_an' : 'fahne_aus', px2, py);
  });

  /* Ziel */
  if(zielPos){
    const zx=zielPos.x-kx;
    if(zx>-30&&zx<SICHT_B+30) sprite('ziel', zx, zielPos.y-ky);
  }

  /* Münzen und Bonus-Diamanten */
  muenzen.forEach(m=>{
    if(m.weg) return;
    const mx=m.x-kx-TILE/2, my=m.y-ky-TILE/2+Math.sin(zeit*3+m.t)*1.6;
    if(mx<-TILE||mx>SICHT_B+TILE) return;
    const phase = Math.floor((zeit*6+m.t)%4);
    if(m.bonus){
      // sanfter Schein, damit der Bonus auch von weitem auffällt
      ctx.fillStyle='rgba(151,117,250,.22)';
      ctx.beginPath(); ctx.arc(mx+TILE/2,my+TILE/2, 9+Math.sin(zeit*4+m.t)*1.5, 0,7); ctx.fill();
      sprite('diamant'+phase, mx, my);
    }else{
      sprite('muenze'+phase, mx, my);
    }
  });

  /* Partikel */
  partikel.forEach(p=>{
    ctx.globalAlpha = Math.max(0,1-p.alter/p.leben);
    ctx.fillStyle=p.farbe;
    ctx.fillRect(Math.round(p.x-kx-p.r), Math.round(p.y-ky-p.r), Math.ceil(p.r*2), Math.ceil(p.r*2));
  });
  ctx.globalAlpha=1;

  /* Liftplattformen samt Schacht */
  lifte.forEach(l=>{
    const lx = Math.round(l.x-kx), ly = Math.round(l.y-ky);
    if(lx < -80 || lx > SICHT_B+80) return;
    // Führungsschiene, damit der Fahrweg sichtbar ist
    ctx.fillStyle='rgba(44,33,64,.16)';
    ctx.fillRect(lx+2, l.obenGrenze-ky, 2, l.untenGrenze-l.obenGrenze+l.h);
    ctx.fillRect(lx+l.b-4, l.obenGrenze-ky, 2, l.untenGrenze-l.obenGrenze+l.h);
    // Plattform
    ctx.fillStyle='#8892A0'; ctx.fillRect(lx, ly, l.b, l.h);
    ctx.fillStyle='#C9D2DE'; ctx.fillRect(lx, ly, l.b, 2);
    ctx.fillStyle='#6B6280'; ctx.fillRect(lx, ly+l.h-1, l.b, 1);
    // Pfeile als Hinweis, solange der Lift noch nicht bewegt wurde
    if(liftHinweis > 0){
      ctx.globalAlpha = Math.min(1, liftHinweis);
      ctx.fillStyle='#2FC79B';
      const m = lx + l.b/2, w = Math.sin(zeit*4)*1.5;
      ctx.beginPath(); ctx.moveTo(m, ly-9+w); ctx.lineTo(m-4, ly-4+w); ctx.lineTo(m+4, ly-4+w); ctx.fill();
      ctx.beginPath(); ctx.moveTo(m, ly+l.h+9-w); ctx.lineTo(m-4, ly+l.h+4-w); ctx.lineTo(m+4, ly+l.h+4-w); ctx.fill();
      ctx.globalAlpha = 1;
    }
  });

  /* Gegner */
  gegner.forEach(g=>zeichneGegner(g,kx,ky));

  /* Aufsteigende Punktezahlen */
  ctx.font='bold 8px ui-rounded, system-ui, sans-serif';
  ctx.textAlign='center';
  texte.forEach(t=>{
    ctx.globalAlpha = Math.max(0, 1 - t.alter/t.leben);
    ctx.fillStyle='rgba(44,33,64,.55)';
    ctx.fillText(t.txt, Math.round(t.x-kx), Math.round(t.y-ky)+1);
    ctx.fillStyle=t.farbe;
    ctx.fillText(t.txt, Math.round(t.x-kx), Math.round(t.y-ky));
  });
  ctx.globalAlpha=1; ctx.textAlign='left';

  /* Der Fuchs – blinkt beim Sterben und während der Schonzeit */
  const blinktTot  = spieler.tot && Math.floor(spieler.totT*14)%2!==0;
  const blinktSchon= spieler.schonzeit>0 && Math.floor(spieler.schonzeit*16)%2!==0;
  if(!blinktTot && !blinktSchon) zeichneFuchs(kx,ky);

  /* Touchpad-Profil: Zeiger sichtbar machen (der echte ist ausgeblendet) */
  if(profil==='touchpad' && maus.imBild){
    ctx.strokeStyle='rgba(44,33,64,.65)'; ctx.lineWidth=1;
    const mx=Math.round(maus.x)+.5, my=Math.round(maus.y)+.5;
    ctx.beginPath(); ctx.moveTo(mx-4,my); ctx.lineTo(mx+4,my);
    ctx.moveTo(mx,my-4); ctx.lineTo(mx,my+4); ctx.stroke();
    ctx.fillStyle = maus.unten ? '#FF6B6B' : 'rgba(255,255,255,.9)';
    ctx.fillRect(mx-1.5,my-1.5,3,3);
  }

  if(szene === 'titel') titelbild(); else hud();

  /* Blende beim Szenenwechsel */
  if(blende > 0){
    const h = Math.ceil(SICHT_H/2 * blende);
    ctx.fillStyle='#2C2340';
    ctx.fillRect(0, 0, SICHT_B, h);
    ctx.fillRect(0, SICHT_H-h, SICHT_B, h);
  }
}

function huegel(off, y, hoch, farbe){
  ctx.fillStyle=farbe;
  ctx.beginPath(); ctx.moveTo(-10,SICHT_H);
  for(let x=-10;x<=SICHT_B+10;x+=8){
    const t=(x+off)*0.012;
    ctx.lineTo(x, y - Math.sin(t)*hoch*0.5 - Math.sin(t*2.3)*hoch*0.25);
  }
  ctx.lineTo(SICHT_B+10,SICHT_H); ctx.fill();
}
function wolken(offX, offY){
  ctx.fillStyle='rgba(255,255,255,.75)';
  [[40,30,11],[150,22,9],[250,42,13],[330,26,10]].forEach(([x,y,r])=>{
    const px=((x-offX)%420+420)%420-50, py=y-offY;
    ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.arc(px+r,py+2,r*0.8,0,7); ctx.arc(px-r,py+2,r*0.7,0,7); ctx.fill();
  });
}

function zeichneGegner(g,kx,ky){
  const x = g.x - kx - (TILE-g.b)/2, y = g.y - ky + g.h - TILE;
  if(x<-30||x>SICHT_B+30) return;
  if(g.tot){
    ctx.globalAlpha = Math.max(0, 1-g.totT/0.7);
    sprite(g.art==='laeufer' ? 'kaefer_platt' : 'flieger0', x, y);
    ctx.globalAlpha = 1;
    return;
  }
  const phase = Math.floor(g.schritt*2)%2;
  sprite(g.art==='laeufer' ? 'kaefer'+phase : 'flieger'+phase, x, y, g.vx>0);
}

function zeichneFuchs(kx,ky){
  const s2 = spieler;
  const x = s2.x - kx - (TILE-s2.b)/2;
  const y = s2.y - ky + s2.h - TILE;

  // Schatten auf dem Boden
  ctx.fillStyle='rgba(44,33,64,.16)';
  ctx.beginPath(); ctx.ellipse(x+TILE/2, y+TILE-0.5, s2.b*0.5, 1.8, 0,0,7); ctx.fill();

  // Glitzerring nach einem Doppelklick-Sprung
  if(s2.extraT>0){
    ctx.globalAlpha = Math.min(1, s2.extraT*2.2);
    ctx.strokeStyle='#FFC93C'; ctx.lineWidth=1.5;
    const w = 1.6-s2.extraT;
    ctx.beginPath(); ctx.ellipse(x+TILE/2, y+TILE/2, 11*w, 9*w, 0,0,7); ctx.stroke();
    ctx.globalAlpha=1;
  }

  sprite(fuchsBild(), x, y, s2.blick<0);
}

/* --- Anzeige oben im Bild --- */
let punkte=0, boni=0, zeit=0, gewonnen=false, gewonnenT=0;
let levelNr = 0;

/* ============================================================
   FORTSCHRITT
   Bleibt auf diesem Gerät. Gespeichert werden nur Zahlen –
   keine Namen, nichts Persönliches, und es wird nichts gesendet.
   ============================================================ */
const SPEICHER = 'fuchssprung';
let fortschritt = { frei:0, best:{} };   // frei = höchstes freigeschaltetes Level

function fortschrittLaden(){
  try{
    const roh = localStorage.getItem(SPEICHER);
    if(roh){
      const f = JSON.parse(roh);
      if(typeof f.frei === 'number') fortschritt.frei = Math.min(f.frei, LEVELS.length-1);
      if(f.best && typeof f.best === 'object') fortschritt.best = f.best;
    }
  }catch(e){ /* privates Fenster o.ä. – dann eben ohne Speicherstand */ }
}
function fortschrittSichern(){
  try{ localStorage.setItem(SPEICHER, JSON.stringify(fortschritt)); }catch(e){}
}
function fortschrittMerken(){
  const alt = fortschritt.best[levelNr] || { muenzen:0, boni:0, zeit:null, punkte:0 };
  fortschritt.best[levelNr] = {
    muenzen: Math.max(alt.muenzen, punkte),
    boni:    Math.max(alt.boni, boni),
    zeit:    alt.zeit===null ? zeit : Math.min(alt.zeit, zeit),
    punkte:  Math.max(alt.punkte||0, punktestand),
  };
  if(levelNr+1 < LEVELS.length) fortschritt.frei = Math.max(fortschritt.frei, levelNr+1);
  fortschrittSichern();
  baueLevelKnoepfe();
}
let gameOver=false, gameOverT=0, pause=false;

/* ============================================================
   SZENEN UND PUNKTE
   'titel'  Titelbild, der Fuchs läuft von allein
   'bereit' BEREIT? / LOS! vor dem Start
   'spiel'  es wird gespielt
   ============================================================ */
let szene = 'titel', szeneT = 0;
let blende = 0;                 // 1 = ganz zu, 0 = offen
let punktestand = 0, kombo = 0, komboT = 0;
let zielBonus = { herzen:0, zeit:0 };
let liftHinweis = 0;   // blendet die Pfeile aus, sobald der Lift benutzt wurde

const WERT = { muenze:100, diamant:1000, gegner:200, herz:500, sekunde:20 };

function punkteGeben(n, x, y, text){
  punktestand += n;
  if(x !== undefined) floattext(x, y, text || ('+'+n));
}

/* Kombo: schnell hintereinander sammeln zahlt sich aus */
function komboErhoehen(){
  kombo = komboT > 0 ? Math.min(kombo+1, 9) : 1;
  komboT = TUNING.komboZeit;
}

function herz(x,y,voll){
  sprite(voll ? 'herz_voll' : 'herz_leer', x-TILE/2, y-TILE/2);
}

function hud(){
  ctx.fillStyle='rgba(44,33,64,.55)';
  ctx.fillRect(0,0,SICHT_B,19);
  ctx.fillStyle='#fff';
  ctx.font='bold 9px ui-rounded, system-ui, sans-serif';
  ctx.textBaseline='middle';

  // Herzen
  for(let i=0;i<TUNING.leben;i++) herz(12+i*14, 10, i<spieler.leben);

  const normale = muenzen.filter(m=>!m.bonus).length;
  ctx.fillText(String(punkte).padStart(2,'0')+'/'+normale, 62, 10);
  // Bonus-Anzeige nur, wenn es welche gibt
  const bonusZahl = muenzen.filter(m=>m.bonus).length;
  if(bonusZahl){
    // Denselben Diamanten zeigen, den man im Level einsammelt –
    // ein Sternzeichen hier wäre ein anderes Symbol als im Spiel.
    sprite('diamant0', 104-TILE/2, 10-TILE/2);
    ctx.fillStyle='#C9B6FF';
    ctx.fillText(boni+'/'+bonusZahl, 116, 10);
    ctx.fillStyle='#fff';
  }
  // Punktestand arcade-typisch mit führenden Nullen
  ctx.fillText(String(punktestand).padStart(6,'0'), 152, 10);
  if(kombo > 1){
    ctx.fillStyle='#FFC93C';
    ctx.fillText('x'+kombo, 202, 10);
    ctx.fillStyle='#fff';
  }
  ctx.fillText('ZEIT '+zeit.toFixed(1)+'s', 283, 10);

  if(spieler.tot && !gameOver){
    ctx.fillStyle='rgba(230,73,128,.30)'; ctx.fillRect(0,0,SICHT_B,SICHT_H);
  }

  if(gewonnen){
    ctx.fillStyle='rgba(44,33,64,.78)'; ctx.fillRect(0,0,SICHT_B,SICHT_H);
    ctx.textAlign='center';
    // Von oben nach unten: Ergebnis, Bonus, Summe, wie es weitergeht
    ctx.fillStyle='#FFC93C'; ctx.font='bold 22px ui-rounded, system-ui, sans-serif';
    ctx.fillText('GESCHAFFT!', SICHT_B/2, 50);

    ctx.fillStyle='#fff'; ctx.font='bold 10px ui-rounded, system-ui, sans-serif';
    ctx.fillText(punkte+' von '+normale+' Münzen  ·  '+zeit.toFixed(1)+' Sekunden', SICHT_B/2, 74);
    if(bonusZahl){
      ctx.fillStyle = boni===bonusZahl ? '#C9B6FF' : 'rgba(255,255,255,.65)';
      const wort = bonusZahl===1 ? 'Diamant' : 'Diamanten';
      ctx.fillText(boni+' von '+bonusZahl+' '+wort, SICHT_B/2, 92);
      sprite('diamant0', SICHT_B/2 - 68 - TILE/2, 88 - TILE/2);
    }

    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.fillText('Herzen +'+zielBonus.herzen+'      Zeit +'+zielBonus.zeit, SICHT_B/2, 118);

    ctx.fillStyle='#FFC93C'; ctx.font='bold 20px ui-rounded, system-ui, sans-serif';
    ctx.fillText(String(punktestand).padStart(6,'0'), SICHT_B/2, 146);

    if(Math.floor(gewonnenT*2)%2===0){
      ctx.fillStyle='#fff'; ctx.font='bold 10px ui-rounded, system-ui, sans-serif';
      const letzte = levelNr+1 >= LEVELS.length;
      ctx.fillText(letzte ? 'Leertaste: noch einmal von vorn'
                          : 'Leertaste: weiter zu "'+LEVELS[levelNr+1].name+'"',
                   SICHT_B/2, 174);
    }
    ctx.textAlign='left';
  }

  if(gameOver){
    ctx.fillStyle='rgba(44,33,64,.78)'; ctx.fillRect(0,0,SICHT_B,SICHT_H);
    ctx.textAlign='center';
    ctx.fillStyle='#FF6B6B'; ctx.font='bold 20px ui-rounded, system-ui, sans-serif';
    ctx.fillText('ALLE HERZEN WEG', SICHT_B/2, 74);
    ctx.fillStyle='#fff'; ctx.font='bold 10px ui-rounded, system-ui, sans-serif';
    ctx.fillText('Du hast '+punkte+' Münzen gesammelt.', SICHT_B/2, 98);
    if(Math.floor(gameOverT*2)%2===0)
      ctx.fillText('Leertaste oder R für einen neuen Versuch', SICHT_B/2, 118);
    ctx.textAlign='left';
  }

  if(szene === 'bereit'){
    const los = szeneT > TUNING.bereitZeit;
    ctx.textAlign='center';
    ctx.fillStyle='rgba(44,33,64,.35)'; ctx.fillRect(0,SICHT_H/2-26,SICHT_B,52);
    ctx.font='bold 26px ui-rounded, system-ui, sans-serif';
    ctx.fillStyle = los ? '#8CE0A8' : '#FFC93C';
    // beim Erscheinen kurz aufziehen
    const t = los ? szeneT-TUNING.bereitZeit : szeneT;
    const gr = 1 + Math.max(0, 0.5 - t*3);
    ctx.save();
    ctx.translate(SICHT_B/2, SICHT_H/2);
    ctx.scale(gr, gr);
    ctx.fillText(los ? 'LOS!' : 'BEREIT?', 0, 9);
    ctx.restore();
    ctx.textAlign='left';
  }

  if(pause){
    ctx.fillStyle='rgba(44,33,64,.70)'; ctx.fillRect(0,0,SICHT_B,SICHT_H);
    ctx.textAlign='center';
    ctx.fillStyle='#fff'; ctx.font='bold 20px ui-rounded, system-ui, sans-serif';
    ctx.fillText('PAUSE', SICHT_B/2, 80);
    ctx.font='bold 10px ui-rounded, system-ui, sans-serif';
    ctx.fillText('Esc drücken zum Weiterspielen', SICHT_B/2, 104);
    ctx.fillText('noch einmal Esc: zurück zum Titelbild', SICHT_B/2, 122);
    ctx.textAlign='left';
  }
}

/* ---------- Titelbild ---------- */
function titelbild(){
  // Kräftig abdunkeln und hinter die Schrift eigene Streifen legen –
  // sonst geht sie im laufenden Attract-Bild dahinter unter.
  ctx.fillStyle='rgba(44,33,64,.55)'; ctx.fillRect(0,0,SICHT_B,SICHT_H);
  ctx.fillStyle='rgba(44,33,64,.55)'; ctx.fillRect(0,30,SICHT_B,72);
  ctx.textAlign='center';

  const schwung = Math.sin(szeneT*2)*3;
  ctx.font='bold 34px ui-rounded, system-ui, sans-serif';
  ctx.fillStyle='rgba(44,33,64,.5)';
  ctx.fillText('FUCHS-SPRUNG', SICHT_B/2+2, 64+schwung+2);
  ctx.fillStyle='#FFC93C';
  ctx.fillText('FUCHS-SPRUNG', SICHT_B/2, 64+schwung);

  ctx.font='bold 10px ui-rounded, system-ui, sans-serif';
  ctx.fillStyle='#fff';
  ctx.fillText('Ein Abenteuer fürs Touchpad', SICHT_B/2, 86);

  // Bestwert über alle Levels
  let best = 0;
  Object.values(fortschritt.best||{}).forEach(b=>{ if(b && b.punkte) best = Math.max(best, b.punkte); });
  if(best){
    ctx.fillStyle='#C9B6FF';
    ctx.fillText('BESTE PUNKTZAHL  '+String(best).padStart(6,'0'), SICHT_B/2, 108);
    ctx.fillStyle='#fff';
  }

  ctx.fillStyle='rgba(44,33,64,.62)'; ctx.fillRect(0,128,SICHT_B,54);
  if(Math.floor(szeneT*1.6)%2===0){
    ctx.font='bold 12px ui-rounded, system-ui, sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('Leertaste oder Klick zum Starten', SICHT_B/2, 146);
  }
  ctx.font='bold 9px ui-rounded, system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.fillText('Level oben auswählen  ·  M Ton  ·  N Musik  ·  C Bildröhre', SICHT_B/2, 168);
  // Dezente Nennung – das Spiel wird an andere Schulen weitergegeben
  ctx.font='bold 7px ui-rounded, system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillText('Andreas Bänninger, PICTS BeLoSe · CC BY-SA 4.0', SICHT_B/2, 180);
  ctx.textAlign='left';
}

/* ============================================================
   SPIELSCHLEIFE mit festem Zeitschritt
   Die Physik rechnet immer 60× pro Sekunde – egal wie schnell
   der Bildschirm ist. Sonst springt der Fuchs auf einem neuen
   Laptop anders weit als auf einem alten.
   ============================================================ */
let letzte=performance.now(), speicher=0;

function schritt(){
  leseEingabe();
  szeneT += DT;
  if(blende > 0) blende = Math.max(0, blende - DT*2.6);
  if(ruettelStaerke>0) ruettelStaerke = Math.max(0, ruettelStaerke-DT*22);

  if(szene === 'titel'){
    selbstSteuern();
    lifteSchritt(); spielerSchritt(); gegnerSchritt(); partikelSchritt(); kameraSetzen();
    return;
  }
  if(szene === 'bereit'){
    // Das Level steht schon da, aber noch rührt sich nichts
    if(szeneT > TUNING.bereitZeit + TUNING.losZeit){ szene = 'spiel'; szeneT = 0; }
    return;
  }

  if(pause){ return; }
  if(gewonnen){ gewonnenT+=DT; partikelSchritt(); kameraSetzen(); return; }

  if(gameOver){
    gameOverT+=DT;
    partikelSchritt();
    return;
  }

  if(spieler.tot){
    spieler.totT+=DT;
    if(spieler.totT>0.85) beimCheckpointStarten();
    partikelSchritt();
    return;
  }

  zeit+=DT;
  if(komboT>0){ komboT -= DT; if(komboT<=0) kombo = 0; }
  texteSchritt();
  if(lifte.length && liftHinweis > 0 && Math.abs(eingabe.y) > 0.08) liftHinweis -= DT*1.6;
  lifteSchritt();
  spielerSchritt();
  gegnerSchritt();
  gegnerPruefen();
  stachelnPruefen();
  checkpointsPruefen();
  partikelSchritt();
  kameraSetzen();

  // Münzen einsammeln
  muenzen.forEach(m=>{
    if(m.weg) return;
    if(Math.abs(m.x-(spieler.x+spieler.b/2))<10 && Math.abs(m.y-(spieler.y+spieler.h/2))<11){
      m.weg=true;
      komboErhoehen();
      if(m.bonus){
        boni++; sfx.bonus(); staub(m.x,m.y,10,'#9775FA');
        punkteGeben(WERT.diamant*kombo, m.x, m.y, '+'+(WERT.diamant*kombo));
      }else{
        punkte++; sfx.muenze(); staub(m.x,m.y,5,'#FFC93C');
        punkteGeben(WERT.muenze*kombo, m.x, m.y,
                    kombo>1 ? (WERT.muenze*kombo)+'  x'+kombo : '+'+WERT.muenze);
      }
    }
  });

  // Ziel erreicht
  if(!gewonnen && Math.abs(zielPos.x+8-(spieler.x+spieler.b/2))<11
              && Math.abs(zielPos.y+8-(spieler.y+spieler.h/2))<14){
    gewonnen=true; gewonnenT=0; sfx.ziel();
    // Schlussrechnung: übrige Herzen und schnelle Zeit zahlen sich aus
    zielBonus = { herzen: spieler.leben*WERT.herz,
                  zeit: Math.max(0, Math.round((180-zeit)*WERT.sekunde)) };
    punktestand += zielBonus.herzen + zielBonus.zeit;
    fortschrittMerken();
    for(let i=0;i<24;i++) staub(zielPos.x+8, zielPos.y+8, 1, ['#FFC93C','#FF6B6B','#2FC79B','#4DABF7'][i%4]);
  }
}

function bild(jetzt){
  let d = (jetzt-letzte)/1000; letzte=jetzt;
  d = Math.min(d, 0.25);                 // nach einem Tab-Wechsel nicht aufholen
  speicher += d;
  let n=0;
  while(speicher >= DT && n<5){ schritt(); speicher-=DT; n++; }
  zeichne();
  requestAnimationFrame(bild);
}

/* ============================================================
   Oberfläche: Profilknöpfe, Skalierung, Hilfetext
   ============================================================ */
function setzeProfil(id){
  profil=id;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('on', b.dataset.id===id));
  stage.classList.toggle('hidecursor', id==='touchpad');
  eingabe.sprung=false; maus.unten=false; tasten.clear();
  zeichneHilfe();
}
function zeichneHilfe(){
  const p=PROFILE.find(p=>p.id===profil);
  document.getElementById('hint').innerHTML =
    p.hilfe + ' &nbsp;·&nbsp; <kbd>R</kbd> neu &nbsp;·&nbsp; <kbd>Esc</kbd> Pause';
}
function baueLevelKnoepfe(){
  const box=document.getElementById('levels'); box.innerHTML='';
  LEVELS.forEach((L,i)=>{
    const offen = i<=fortschritt.frei;
    const best = fortschritt.best[i];
    const b=document.createElement('button');
    b.className='pbtn'+(i===levelNr?' on':'')+(offen?'':' zu');
    b.title = offen ? L.name : 'Erst das Level davor schaffen';
    b.innerHTML = `<span>${offen ? (i+1) : '🔒'}</span><span>${L.name}</span>` +
                  (best ? '<span class="hak">✔</span>' : '');
    if(offen) b.onclick=()=>levelWechseln(i);
    box.appendChild(b);
  });
  const t=document.createElement('div'); t.className='trenn'; box.appendChild(t);
}

let crtAn = false;
function crtUmschalten(){
  crtAn = !crtAn;
  document.getElementById('stage').classList.toggle('crt', crtAn);
  knoepfeAuffrischen();
}
function tonUmschalten(){
  tonAn = !tonAn;
  if(!tonAn){ musikStopp(); } else if(musikAn){ musikStart(); }
  knoepfeAuffrischen();
  if(tonAn) beep(700,.06,'triangle',.12);
}

const SCHALTER = [
  { id:'ton',   zeichen:'🔊', aus:'🔇', titel:'Ton an/aus (M)',     an:()=>tonAn,  klick:tonUmschalten },
  { id:'musik', zeichen:'🎵', aus:'🎵', titel:'Musik an/aus (N)',   an:()=>musikAn && tonAn, klick:musikUmschalten },
  { id:'crt',   zeichen:'📺', aus:'📺', titel:'Bildröhren-Optik (C)',an:()=>crtAn, klick:crtUmschalten },
];
function knoepfeAuffrischen(){
  const box = document.getElementById('schalter');
  if(!box) return;
  box.innerHTML = '';
  SCHALTER.forEach(k=>{
    const b = document.createElement('button');
    const an = k.an();
    b.className = 'sbtn' + (an ? '' : ' aus');
    b.title = k.titel;
    b.textContent = an ? k.zeichen : k.aus;
    b.onclick = k.klick;
    box.appendChild(b);
  });
  zeichneHilfe();
}

(function baueKnoepfe(){
  const box=document.getElementById('profiles');
  PROFILE.forEach(p=>{
    const b=document.createElement('button');
    b.className='pbtn'; b.dataset.id=p.id;
    b.innerHTML=`<span>${p.emo}</span><span>${p.name}</span><span class="key">${p.taste}</span>`;

/* Ganzzahlige Skalierung – so bleiben die Pixel scharf (Arcade-Optik) */
function skalieren(){
  const maxB = Math.min(window.innerWidth-28, 1100);
  const maxH = window.innerHeight - 170;
  let f = Math.max(1, Math.floor(Math.min(maxB/SICHT_B, maxH/SICHT_H)));
  cv.style.width  = (SICHT_B*f)+'px';
  cv.style.height = (SICHT_H*f)+'px';
}
addEventListener('resize', skalieren);

/* Ton darf in Browsern erst nach einer Eingabe losgehen. */
let tonFreigegeben = false;
function tonFreigeben(){
  if(tonFreigegeben) return;
  tonFreigegeben = true;
  try{ tonAusgabe(); if(musikAn && tonAn) musikStart(); }catch(e){}
}
addEventListener('keydown', tonFreigeben, { once:false });
addEventListener('pointerdown', tonFreigeben, { once:false });

/* ============================================================
   ANSCHLUSS AN DIE ÜBUNGS-APP
   Läuft diese Datei allein, passiert hier nichts. In der
   zusammengebauten Fassung meldet sich die Brücke und es gibt
   einen Weg zurück zur Stationskarte.
   ============================================================ */
if(window.BRUECKE){
  const k = document.getElementById('kartenKnopf');
  k.style.display = '';
  k.onclick = ()=>{ musikStopp(); window.BRUECKE.zurKarte(); };
  window.BRUECKE.sprungBereit({
    zumTitel,
    alleFreischalten: ()=>{ fortschritt.frei = LEVELS.length-1; fortschrittSichern(); baueLevelKnoepfe(); },
    fortschrittLoeschen: ()=>{ fortschritt = { frei:0, best:{} }; fortschrittSichern(); baueLevelKnoepfe(); },
    musikStopp, musikStart,
    anzahlLevels: LEVELS.length,
  });
}

/* Start */
fortschrittLaden();
zumTitel();
setzeProfil('touchpad');
knoepfeAuffrischen();
skalieren();
requestAnimationFrame(bild);
</script>
